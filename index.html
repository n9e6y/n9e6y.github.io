  /* Hero */
  #home {
    position: relative; overflow: hidden;

  /* Negative left margin cancels the "H" side bearing so the big headline lines up with the text below. */

  #home .lede { margin: 32px 0 0; max-width: 30ch; }

  /* "I like ___." The word slides up and out while the next slides in; the box eases to the new

  .rotator .rw { position: absolute; left: 0; top: 0; opacity: 0; transform: translateY(80%); transition: transform .6s var(--ease), opacity .45s ease; }
  .rotator .rw.in { position: relative; opacity: 1; transform: none; }
  .rotator .rw.out { opacity: 0; transform: translateY(-80%); }

  .hero-index .wrap {

<script>
(function () {
  // ---- "I like ___" rotation. Tune here. ----
  var LIKES = {
    words: ['computers', 'data', 'algorithms', 'chess', 'ML', 'Hearthstone'],
    every: 3500,      // ms each word stays
    hoverEvery: 1300  // ms each word stays while the pointer is on the line
  };
  var line = document.getElementById('likes');
  if (!line) return;
  var box = line.querySelector('.rotator'), i = 0, timer = null, hovering = false;
  var spans = LIKES.words.map(function (w, k) {
    if (k === 0) { var first = box.querySelector('.rw'); first.textContent = w; return first; }
    var el = document.createElement('span'); el.className = 'rw'; el.textContent = w; box.appendChild(el); return el;
  });
  function fit() { box.style.width = spans[i].offsetWidth + 'px'; }
  function next() {
    var cur = spans[i];
    i = (i + 1) % spans.length;
    var nxt = spans[i];
    nxt.classList.remove('out'); nxt.style.transition = 'none'; nxt.offsetWidth; nxt.style.transition = '';
    cur.classList.remove('in'); cur.classList.add('out');
    nxt.classList.add('in');
    fit();
    schedule();
  }
  function schedule() { clearTimeout(timer); timer = setTimeout(next, hovering ? LIKES.hoverEvery : LIKES.every); }
  line.addEventListener('pointerenter', function () { hovering = true; schedule(); });
  line.addEventListener('pointerleave', function () { hovering = false; schedule(); });
  fit();
  if (document.fonts) document.fonts.ready.then(fit);
  window.addEventListener('resize', fit);
  schedule();
})();
</script>
