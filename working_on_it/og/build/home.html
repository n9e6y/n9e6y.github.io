<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..900&family=Geist+Mono:wght@400..600&family=Vazirmatn:wght@300..700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F6F6F3; -webkit-font-smoothing: antialiased; }
  body { position: relative; box-sizing: border-box; padding: 72px 80px 64px; display: flex; flex-direction: column;
         font-family: 'Geist', sans-serif; color: #111110; }
  [lang="fa"] { font-family: 'Vazirmatn', sans-serif; }
  svg.bg { position: absolute; inset: 0; }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; height: 44px; }
  .top img { height: 44px; width: auto; display: block;  }
  .crumb { font-family: 'Geist Mono', monospace; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 14px; }
  .crumb .s { color: #A3A39D; }
  .crumb .t { color: #6B6B66; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; min-height: 0; }
  .name { font-size: 92px; font-weight: 500; letter-spacing: -.045em; line-height: .95; margin-left: -5px; white-space: nowrap; }
  .lede { font-size: 26px; line-height: 1.35; color: #5E5E59; text-wrap: pretty; }
  main.home { max-width: 540px; }
  main.big { flex-direction: row; align-items: center; justify-content: flex-start; }
  .big h1 { margin: 0 0 0 -12px; font-size: 208px; font-weight: 500; letter-spacing: -.055em; line-height: .9; }
  .single h1 { margin: 0 0 0 -3px; font-size: 76px; font-weight: 500; letter-spacing: -.04em; line-height: 1.02; max-width: 980px; text-wrap: balance; }
  .single .deck { margin: 0; font-size: 28px; line-height: 1.4; color: #5E5E59; max-width: 960px; text-wrap: pretty; }
  .foot { position: relative; border-top: 1px solid #DCDCD7; padding-top: 24px; display: flex; justify-content: space-between;
          font-family: 'Geist Mono', monospace; font-size: 22px; background: #F6F6F3; }
  .foot b { font-weight: 500; }
  .foot span { color: #6B6B66; }
</style></head><body>
<svg class="bg" id="bolt" width="1200" height="630" viewBox="0 0 1200 630"></svg><div class="top"><img src="../logo-96.png" alt="96"></div><main class="home"><div class="name">Nima Yavari</div><div class="lede">I build LLM applications, AI pipelines and the backend systems behind them.</div></main><div class="foot"><b>n9e6y.com</b><span>Works · Writings · About</span></div>
<script>
function lightning(seed, o = {}) {
  let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const bolts = [], nodes = [];
  const c = o.color || '#E0E0DB', dot = o.dot || '#D6D6D1', hotC = o.hot || '#BDBDB7', hotD = o.hotDot || '#B0B0AA';
  const maxD = o.depth ?? 6, decay = o.decay ?? .28;
  const jag = (x1, y1, x2, y2, amp) => {
    let pts = [[x1, y1], [x2, y2]];
    for (let k = 0; k < 3; k++) {
      const out = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1], [bx, by] = pts[i], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
        const off = (rnd() - .5) * amp * L / 60;
        out.push([(ax + bx) / 2 - dy / L * off, (ay + by) / 2 + dx / L * off], [bx, by]);
      }
      pts = out; amp *= .55;
    }
    return pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  };
  const path = [1, 1, 1, 1, 0, 0, 1, 0];
  const grow = (x, y, ang, len, d, onPath) => {
    const x2 = x + Math.sin(ang) * len, y2 = y + Math.cos(ang) * len;
    const hot = !!o.accent && onPath;
    bolts.push({ pts: jag(x, y, x2, y2, o.amp ?? 14), stroke: hot ? hotC : c, w: Math.max(o.minW ?? .8, (o.w ?? 2.2) + (hot ? .4 : 0) - d * decay), hot });
    nodes.push({ x: x2, y: y2, r: Math.max(1.2, (o.r ?? 3) - d * .3), fill: hot ? hotD : dot, hot });
    if (d >= maxD) return;
    const spread = (o.spread ?? .4) + rnd() * (o.spreadVar ?? .25), nl = len * ((o.shrink ?? .72) + rnd() * .1);
    [-1, 1].forEach((sg, k) => grow(x2, y2, ang + sg * spread + (rnd() - .5) * .12, nl, d + 1, onPath && path[d] === k));
  };
  (o.roots || [[820, -40, 0, 165]]).forEach(([x, y, a, l]) => grow(x, y, a + (rnd() - .5) * .1, l, 0, true));
  bolts.sort((a, b) => a.hot - b.hot); nodes.sort((a, b) => a.hot - b.hot);
  return { bolts, nodes };
}

const t = lightning(9696, {"accent": true}), svg = document.getElementById('bolt'), NS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); };
t.bolts.forEach(b => el('polyline', { points: b.pts, fill: 'none', stroke: b.stroke, 'stroke-width': b.w, 'stroke-linejoin': 'miter', 'stroke-linecap': 'round' }));
t.nodes.forEach(n => el('circle', { cx: n.x, cy: n.y, r: n.r, fill: n.fill }));
</script>
</body></html>
