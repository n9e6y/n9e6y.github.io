<html><body style="margin:0;background:#888;display:flex;gap:10px">
<iframe id="a" src="" style="width:1000px;height:900px;border:0"></iframe>
<iframe id="b" src="" style="width:430px;height:900px;border:0"></iframe>
<script>
var q = new URLSearchParams(location.search), to = q.get('to'), th = q.get('theme'), menu = q.get('menu');
['a','b'].forEach(function (id) {
  var f = document.getElementById(id);
  f.src = q.get('p') || '/';
  f.onload = function () {
    var w = f.contentWindow, d = f.contentDocument;
    if (th) { d.documentElement.dataset.theme = th; }
    w.document.documentElement.style.scrollBehavior = 'auto';
    if (to) { var el = d.querySelector(to); w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - 70); }
    if (q.get('data')) d.querySelectorAll('.fig-tools button:first-child').forEach(function (b) { b.click(); });
    if (menu) { var b = d.querySelector('.menu-btn'); b && getComputedStyle(b).display !== 'none' && b.click(); }
  };
});
</script></body></html>
